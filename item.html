<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lost & Found</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <h1><span class="logo-text">🎒 Lost & Found</span></h1>
      <div class="auth-buttons" id="authButtons">
        <!-- Filled dynamically by script.js -->
      </div>
    </div>
    <input type="text" placeholder="Search for lost or found items..." class="search-bar" />
    <button class="post-button" id="postButton" onclick="openModal('postModal')" disabled>+ Post Lost Item</button>
  </header>

  <section class="filters">
    <button class="filter-button" data-filter="all">All</button>
    <button class="filter-button" data-filter="lost">Lost</button>
    <button class="filter-button" data-filter="found">Found</button>
  </section>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-button" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" placeholder="University Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- REGISTER MODAL -->
  <div id="registerModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-button" onclick="closeModal('registerModal')">&times;</span>
      <h2>Register</h2>
      <form id="registerForm">
        <input type="email" id="registerEmail" placeholder="University Email" required />
        <input type="password" id="registerPassword" placeholder="Password" minlength="8" required />
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <!-- POST ITEM MODAL -->
  <div id="postModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-button" onclick="closeModal('postModal')">&times;</span>
      <h2>Post Lost & Found Item</h2>
      <form id="postForm">
        <input type="text" id="itemTitle" placeholder="Item Title" required />
        <input type="text" id="itemDescription" placeholder="Description" required />
        <input type="text" id="itemLocation" placeholder="Location (optional)" />
        <input type="file" id="itemImage" accept="image/*" />
        <button type="submit">Submit Item</button>
      </form>
    </div>
  </div>

  <main class="item-details-container" id="itemDetails"></main>

  <script src="script.js"></script>
</body>
</html>

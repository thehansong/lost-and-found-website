<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lost & Found</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Lost & Found</h1>
      <div class="auth-buttons">
        <button class="auth-button" onclick="openModal('loginModal')">Login</button>
        <button class="auth-button register" onclick="openModal('registerModal')">Register</button>
      </div>
    </div>
    <input type="text" placeholder="Search for lost or found items..." class="search-bar" />
  </header>

  <section class="filters">
    <button class="filter-button">All</button>
    <button class="filter-button">Lost</button>
    <button class="filter-button">Found</button>
    <button class="filter-button">Electronics</button>
    <button class="filter-button">Pets</button>
  </section>

  <main class="item-grid" id="itemGrid">
    <div class="item-card">
      <img src="https://lostfound-images-team14.s3.us-east-1.amazonaws.com/sshreked.jpeg" alt="Item Image">
      <div class="item-info">
        <h2>Black Wallet</h2>
        <p>Lost near Orchard MRT. Contains ID and credit cards.</p>
        <span class="tag lost">Lost</span>
      </div>
    </div>
    <div class="item-card">
      <img src="https://via.placeholder.com/150" alt="Item Image">
      <div class="item-info">
        <h2>Orange Cat</h2>
        <p>Found near Bishan Park. Very friendly and healthy.</p>
        <span class="tag found">Found</span>
      </div>
    </div>
  </main>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-button" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" placeholder="University Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- REGISTER MODAL -->
  <div id="registerModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-button" onclick="closeModal('registerModal')">&times;</span>
      <h2>Register</h2>
      <form id="registerForm">
        <input type="email" placeholder="University Email" required />
        <input type="password" placeholder="Password" required />
        <input type="password" placeholder="Confirm Password" required />
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
